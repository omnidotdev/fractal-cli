name: Release 🏗️

# Build `fractal` binaries for Linux (glibc) and macOS (amd64 + arm64) on every
# push to master and publish them to this repo's GitHub Releases, tagged
# `cli-v<run-number>` (see the install section of the README).
#
# This crate has `fractal-operator = { path = "../fractal-operator" }`, so the
# build checks out the private fractal-operator repo (via the org-wide GH_PAT)
# as a sibling directory to resolve that path dependency, matching the on-disk
# monorepo layout.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }}) 🔨
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: fractal-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: fractal-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: fractal-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: fractal-darwin-arm64
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4
        with:
          path: fractal-cli

      - name: Checkout operator (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: omnidotdev/fractal-operator
          ref: master
          token: ${{ secrets.GH_PAT }}
          path: fractal-operator

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        working-directory: fractal-cli
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          # Stamped into `fractal --version` by build.rs; the run number
          # is the same N as the `cli-v<N>` release tag
          FRACTAL_BUILD: ${{ github.run_number }}
        run: |
          export FRACTAL_GIT_SHA="${GITHUB_SHA::7}"
          cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        working-directory: fractal-cli
        run: |
          cp target/${{ matrix.target }}/release/fractal ../${{ matrix.artifact }}
          chmod +x ../${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            cp "$dir"* release/
          done
          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-v${{ github.run_number }}
          name: Fractal CLI (build ${{ github.run_number }})
          files: release/*
