name: Release 🏗️

# Build static `fractal` binaries for Linux and macOS (amd64 + arm64) on every
# push to master and publish them to the fractal-stack monorepo's GitHub
# Releases, tagged `cli-v<run-number>`. The CLI is developed in this standalone
# repo but its binaries live in the monorepo releases so there is one download
# home for the whole stack (see the install section of the README). Publishing
# cross-repo uses the org-wide GH_PAT, since the default GITHUB_TOKEN is scoped
# to this repo only.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }}) 🔨
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: fractal-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: fractal-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: fractal-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: fractal-darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cp target/${{ matrix.target }}/release/fractal ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            cp "$dir"* release/
          done
          ls -la release/

      - uses: softprops/action-gh-release@v2
        with:
          repository: omnidotdev/fractal-stack
          token: ${{ secrets.GH_PAT }}
          tag_name: cli-v${{ github.run_number }}
          name: Fractal CLI (build ${{ github.run_number }})
          files: release/*
