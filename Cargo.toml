[package]
name = "fractal-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Omni <team@omni.dev>"]
description = "CLI for the Fractal cloud platform"
license = "MIT"
repository = "https://github.com/omnidotdev/fractal-cli"
readme = "README.md"
keywords = ["kubernetes", "cli", "fractal", "cloud"]
categories = ["development-tools"]

[[bin]]
name = "fractal"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "3"
dialoguer = "0.11"
fractal-operator = { path = "../fractal-operator" }
k8s-openapi = { version = "0.27", default-features = false, features = ["latest"] }
kube = { version = "3", features = ["runtime", "derive"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
which = "7"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
