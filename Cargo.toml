[package]
name = "fractal-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Omni <team@omni.dev>"]
description = "CLI for the Fractal cloud platform"
license = "Apache-2.0"
readme = "README.md"
homepage = "https://fractal.omni.dev"
repository = "https://github.com/omnidotdev/fractal-cli"
keywords = ["kubernetes", "cli", "fractal", "cloud"]
categories = ["development-tools"]

[[bin]]
name = "fractal"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
colored = "3"
dirs = "6"
fractal-operator = { path = "../fractal-operator" }
futures = "0.3"
k8s-openapi = { version = "0.27", default-features = false, features = ["latest"] }
kube = { version = "3", features = ["runtime", "derive", "ws"] }
rand = "0.9"
rpassword = "7"
# rustls-tls-native-roots picks up the system trust store via rustls.
# Keep aws-lc-rs OUT of the dep tree: `default-features = false` drops
# reqwest's default-tls (which pulls aws-lc-sys via hyper-rustls and
# bites us with rustc ICEs at build time, see operator's same pattern.)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
